<style>/* ---- base.css */

  }
}

  --bg: #15181e; --panel: #1d2129; --panel2: #262b35; --fg: #e5e8ee; --muted: #a2aaba;
  --line: #363c48; --grid: #242931; --accent: #6e9bff; --accent-fg: #0b1222; --sel: #23365c; --hover: #20262f;

* { box-sizing: border-box; }

}

/* ---- board.css */
.board { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 12px; padding: 12px; height: 100%; overflow: auto; align-items: start; }

/* ---- card.css */
.card {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(470px, 100vw); z-index: 40; background: var(--bg);
  border-left: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column;

/* ---- dialogs.css */
dialog.modal { border: 1px solid var(--line); border-radius: 12px; padding: 0; background: var(--bg); color: var(--fg); width: min(480px, 94vw); max-height: 92vh; box-shadow: var(--shadow); }

.m-head h2 { margin: 0; font-size: 16px; }
.m-body { padding: 14px 16px; overflow: auto; }
.m-body .fld { margin-bottom: 10px; }

.menu { position: fixed; z-index: 100; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; box-shadow: var(--shadow); padding: 4px; min-width: 220px; max-height: 75vh; overflow: auto; }

.pi-opts { display: flex; flex-wrap: wrap; gap: 10px 22px; margin: 10px 0; align-items: flex-start; }
.pi-opts fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px 6px; margin: 0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.pi-opts fieldset.attn { border-color: var(--danger); }
.pi-opts legend { font-size: 12px; color: var(--muted); }
.pi-detected { font-size: 12px; color: var(--muted); }
.pi-map { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }

.pi-src { font-weight: 600; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pi-preview { max-height: 300px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
.pi-preview table { border-collapse: collapse; width: 100%; font-size: 12px; }
.pi-preview th, .pi-preview td { padding: 3px 8px; border-bottom: 1px solid var(--grid); text-align: left; white-space: nowrap; }
.pi-preview th { position: sticky; top: 0; background: var(--panel); }
.pi-preview .pv-sec td { font-weight: 700; background: var(--panel2); }
.pi-warn { color: var(--warn); font-size: 12px; max-height: 80px; overflow: auto; }
.kbd-table { border-collapse: collapse; width: 100%; }
.kbd-table td { padding: 4px 6px; border-bottom: 1px solid var(--grid); vertical-align: top; }
.kbd-table td:first-child { white-space: nowrap; width: 42%; }

/* ---- gantt.css */
.gt-scroll { height: 100%; overflow: auto; position: relative; background: var(--bg); }
.gt-head { position: sticky; top: 0; z-index: 3; height: 44px; }
.gt-head svg { display: block; }
.gt-body { position: relative; }
.gt-win { position: absolute; left: 0; }
.gt-win svg { display: block; overflow: visible; }
.gt-over { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
.gt-tmp { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 5 3; fill: none; }
.gt-tip { position: absolute; z-index: 6; background: var(--fg); color: var(--bg); font-size: 12px; padding: 3px 7px; border-radius: 5px; pointer-events: none; white-space: nowrap; }
.gt-win .bar { cursor: grab; }
.readonly .gt-win .bar, .gt-win .bar.sum { cursor: default; }
.gt-win .bar .hd { fill: var(--bg); stroke: var(--accent); stroke-width: 1.5; opacity: 0; cursor: crosshair; }
.gt-win .bar:hover .hd, .gt-win .bar.link-target .hd { opacity: 1; }
.gt-win .bar .rz { fill: transparent; cursor: ew-resize; }
.gt-win .bar.link-target .b { stroke: var(--accent); stroke-width: 3; }
.gt-win .lk { cursor: pointer; }
.gt-win .lk:hover .ln { stroke: var(--accent); stroke-width: 2.6; stroke-dasharray: none; marker-end: url(#g-mh); }
.gt-win .lbl { pointer-events: none; }

/* ---- grid.css */
.g-scroll { height: 100%; overflow: auto; position: relative; }
.g-head {
  position: sticky; top: 0; z-index: 3; display: grid; grid-template-columns: var(--gcols); width: var(--gwidth);
  height: 44px; background: var(--panel); border-bottom: 1px solid var(--line);
}
.gh { position: relative; display: flex; align-items: flex-end; padding: 0 6px 7px; font-weight: 600; font-size: 12px; color: var(--muted); border-right: 1px solid var(--grid); user-select: none; }
.gh.r { justify-content: flex-end; }
.rs { position: absolute; right: -4px; top: 0; bottom: 0; width: 8px; cursor: col-resize; z-index: 2; }
.rs:hover { background: var(--accent); opacity: 0.35; }
.g-body { position: relative; width: var(--gwidth); outline: none; }
.g-empty { position: absolute; top: 80px; left: 0; right: 0; text-align: center; color: var(--muted); }
.gr {
  position: absolute; left: 0; height: var(--rowh); width: var(--gwidth); display: grid; grid-template-columns: var(--gcols);
  border-bottom: 1px solid var(--grid); background: var(--bg);
}
.gr.task[style*="--tint"]::before { content: ""; position: absolute; inset: 0; background: var(--tint); opacity: 0.07; pointer-events: none; }
.gr.sel { background: var(--sel); }
.gr:hover:not(.sel) { background: var(--hover); }
.gr.sum { font-weight: 700; }
.gr.crit .c-name .nm { color: var(--crit); }
.gr.overdue .c-finish { color: var(--danger); font-weight: 600; }
.gc { position: relative; display: flex; align-items: center; padding: 0 6px; overflow: hidden; white-space: nowrap; border-right: 1px solid var(--grid); min-width: 0; }
.gc.r { justify-content: flex-end; font-variant-numeric: tabular-nums; }
.gc.act { box-shadow: inset 0 0 0 1px var(--line); }
.g-body:focus .gc.act { box-shadow: inset 0 0 0 2px var(--focus); }
.gc.editing { padding: 0 2px; overflow: visible; }
.ed { width: 100%; height: calc(var(--rowh) - 6px); padding: 1px 5px; font-weight: 400; }
.c-name .ed { flex: 1; }
.c-num { padding: 0 2px; cursor: grab; color: var(--muted); }
.num-btn { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 2px 4px; border-radius: 4px; font-size: 12px; font-variant-numeric: tabular-nums; }
.num-btn:hover { background: var(--panel2); color: var(--accent); }
.nm { overflow: hidden; text-overflow: ellipsis; }
.ind { flex: none; }
.tog { flex: none; width: 18px; height: 18px; border: 0; background: none; cursor: pointer; padding: 0; color: var(--muted); font-size: 11px; border-radius: 3px; }
.tog:hover { background: var(--panel2); color: var(--fg); }
.tog-sp { flex: none; width: 18px; }
.prog { flex: none; width: 24px; height: 5px; border-radius: 3px; background: var(--panel2); margin-right: 5px; overflow: hidden; }
.prog span { display: block; height: 100%; background: var(--ok); }
.var-late { color: var(--danger); font-weight: 600; }
.var-early { color: var(--ok); }
.gr.section { font-weight: 700; }
.gr.section::before { content: ""; position: absolute; inset: 0; background: var(--sec); opacity: 0.18; pointer-events: none; }
.gr.section .c-num { border-left: 5px solid var(--sec); }
.sec-body { grid-column: 2 / -1; gap: 6px; }
.sec-body .nm { font-size: 13px; }
.swatch { flex: none; width: 16px; height: 16px; border-radius: 4px; border: 1px solid rgba(0, 0, 0, 0.2); cursor: pointer; padding: 0; }
.sec-count { color: var(--muted); font-weight: 400; font-size: 12px; }
.sec-menu { width: 24px; height: 22px; margin-left: 2px; border-color: transparent; background: transparent; }
.drag { letter-spacing: -3px; padding-left: 4px; }
.drop-line { position: absolute; right: 0; height: 2px; background: var(--accent); z-index: 4; pointer-events: none; }
.drop-line::before { content: ""; position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.gr.drop-in { box-shadow: inset 0 0 0 2px var(--accent); }
.dragging .g-rows { cursor: grabbing; }

/* ---- layout.css */
#app { height: 100vh; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 14px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
.banner { display: flex; align-items: center; gap: 10px; padding: 6px 12px; font-size: 13px; border-bottom: 1px solid var(--warn); background: color-mix(in srgb, var(--warn) 14%, var(--bg)); }
.banner[hidden] { display: none; }
.banner-text { font-weight: 600; }
.brand { font-size: 22px; color: var(--accent); line-height: 1; }
.plan-meta { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.pm-row1 { display: flex; align-items: center; gap: 6px; }
.plan-name { font-size: 17px; font-weight: 700; border-color: transparent; background: transparent; width: 26ch; padding: 2px 6px; }
.plan-name:hover { border-color: var(--line); }
.save-state { font-size: 11px; color: var(--muted); white-space: nowrap; }
.save-state.err { color: var(--danger); font-weight: 600; }
.ro-badge { display: none; font-size: 11px; font-weight: 700; color: var(--warn); border: 1px solid currentColor; border-radius: 10px; padding: 0 8px; }
.readonly .ro-badge { display: inline-block; }
.pm-row2 { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.pm-row2 label { display: flex; align-items: center; gap: 4px; }
.pm-row2 input, .pm-row2 select { padding: 1px 4px; font-size: 12px; color: var(--fg); }
.pm-row2 input[data-p="owner"] { width: 14ch; }
.stats { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); font-size: 12px; white-space: nowrap; }
button.chip { cursor: pointer; }
button.chip:hover { background: var(--hover); }
.chip.bad { color: var(--danger); border-color: var(--danger); }
.chip.conf { color: var(--conf); border-color: var(--conf); font-weight: 600; }
.chip .bar-mini { width: 40px; height: 5px; border-radius: 3px; background: var(--panel2); overflow: hidden; display: inline-block; }
.chip .bar-mini span { display: block; height: 100%; background: var(--ok); }
.top-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }

const STATUSES = ['Not started', 'In progress', 'Blocked', 'Done'];
const PRIORITIES = ['Low', 'Medium', 'High', 'Critical'];
const PLAN_STATUSES = ['On track', 'At risk', 'Off track', 'On hold', 'Complete'];
const LOG_STATUSES = {
  risks: ['Open', 'Mitigating', 'Closed'],
  decisions: ['Proposed', 'Agreed', 'Rejected'],
  questions: ['Open', 'Answered', 'Closed'],
};
const LOG_FIELDS = {
  risks: ['risk', 'impact', 'likelihood', 'mitigation', 'owner', 'status'],
  decisions: ['decision', 'by', 'date', 'status'],
  questions: ['question', 'owner', 'answer', 'status'],
};
const LEVELS = ['Low', 'Medium', 'High'];
const PALETTE = [
  { name: 'Blue', color: '#3b82f6' },
  { name: 'Teal', color: '#0d9488' },
  { name: 'Green', color: '#16a34a' },
  { name: 'Lime', color: '#65a30d' },
  { name: 'Amber', color: '#d97706' },
  { name: 'Orange', color: '#ea580c' },
  { name: 'Red', color: '#dc2626' },
  { name: 'Pink', color: '#db2777' },
  { name: 'Purple', color: '#7c3aed' },
  { name: 'Slate', color: '#64748b' },
];

const DEFAULT_SETTINGS = {
  autoSchedule: true,
  showCritical: false,
  showBaseline: false,
  zoom: 'week',
  dayWidth: 0,
  labelMode: 'name',
  columns: null,
  gridWidth: 0,
};

function uid() {
  const a = new Uint8Array(8);
  globalThis.crypto.getRandomValues(a);
  return 'p' + Array.from(a, (b) => b.toString(36).padStart(2, '0')).join('').slice(0, 12);
}

function nowStamp() {
  return new Date().toISOString();
}

function nextId(plan) {
  return plan.nextId++;
}

function createTask(plan, fields = {}) {
  const start = fields.start || plan.start || todayISO();
  const s = nextWorkday(parseISO(start));
  const milestone = !!fields.milestone;
  const duration = milestone ? 0 : fields.duration != null ? Math.max(1, clampDuration(fields.duration)) : 1;
  const stamp = nowStamp();
  return {
    id: fields.id != null ? fields.id : nextId(plan),
    kind: 'task',
    level: 0,
    name: '',
    desc: '',
    start: toISO(s),
    finish: toISO(finishFromDuration(s, duration)),
    duration,
    progress: 0,
    status: 'Not started',
    priority: 'Medium',
    owner: '',
    workstream: '',
    tags: [],
    milestone,
    notes: '',
    preds: [],
    custom: [],
    collapsed: false,
    baseline: null,
    createdAt: stamp,
    updatedAt: stamp,
    ...fields,
    ...(fields.start || fields.duration != null || fields.milestone
      ? { start: toISO(s), finish: toISO(finishFromDuration(s, duration)), duration, milestone }
      : {}),
  };
}

function createSection(plan, fields = {}) {
  return {
    id: fields.id != null ? fields.id : nextId(plan),
    kind: 'section',
    level: 0,
    name: 'New section',
    color: PALETTE[0].color,
    collapsed: false,
    ...fields,
  };
}

function createPlan(fields = {}) {
  const stamp = nowStamp();
  return {
    schema: SCHEMA_VERSION,
    app: 'planboard',
    id: uid(),
    name: 'Untitled plan',
    owner: '',
    start: todayISO(),
    statusDate: '',
    status: 'On track',
    rows: [],
    nextId: 1,
    baselineSavedAt: null,
    logs: { risks: [], decisions: [], questions: [] },
    settings: { ...DEFAULT_SETTINGS },
    createdAt: stamp,
    updatedAt: stamp,
    ...fields,
  };
}

const str = (v, max = 20000) => (v == null ? '' : String(v).slice(0, max));
const pick = (v, list, dflt) => (list.includes(v) ? v : dflt);
const COLOR_RE = /^#[0-9a-f]{6}$/i;

function normTask(t, plan) {
  const milestone = !!t.milestone;
  let start = isISODate(t.start) ? t.start : plan.start;
  let finish = isISODate(t.finish) ? t.finish : null;
  let duration = Number.isFinite(+t.duration) ? clampDuration(t.duration) : null;
  if (milestone) {
    duration = 0;
    finish = start;
  } else if (finish && parseISO(finish) >= parseISO(start)) {
    duration = Math.max(1, durationFromDates(parseISO(start), parseISO(finish)));
    if (duration > MAX_DURATION) {
      duration = MAX_DURATION;
      finish = toISO(finishFromDuration(parseISO(start), duration));
    }
  } else {
    duration = Math.max(1, duration || 1);
    finish = toISO(finishFromDuration(parseISO(start), duration));
  }
  const preds = Array.isArray(t.preds)
    ? t.preds
        .filter((p) => p && Number.isInteger(+p.id))
        .map((p) => ({ id: +p.id, type: pick(String(p.type || 'FS').toUpperCase(), LINK_TYPES, 'FS'), lag: clampLag(p.lag) }))
    : [];
  const baseline =
    t.baseline && isISODate(t.baseline.start) && isISODate(t.baseline.finish)
      ? { start: t.baseline.start, finish: t.baseline.finish }
      : null;
  return {
    id: +t.id,
    kind: 'task',
    level: Math.max(0, Math.floor(+t.level || 0)),
    name: str(t.name, 500),
    desc: str(t.desc),
    start,
    finish,
    duration,
    progress: Math.max(0, Math.min(100, Math.round(+t.progress || 0))),
    status: pick(t.status, STATUSES, 'Not started'),
    priority: pick(t.priority, PRIORITIES, 'Medium'),
    owner: str(t.owner, 200),
    workstream: str(t.workstream, 200),
    tags: Array.isArray(t.tags) ? t.tags.map((x) => str(x, 60).trim()).filter(Boolean) : [],
    milestone,
    notes: str(t.notes),
    preds,
    custom: Array.isArray(t.custom)
      ? t.custom.filter((c) => c && typeof c === 'object').map((c) => ({ key: str(c.key, 200), value: str(c.value, 2000) }))
      : [],
    collapsed: !!t.collapsed,
    baseline,
    createdAt: str(t.createdAt, 40) || nowStamp(),
    updatedAt: str(t.updatedAt, 40) || nowStamp(),
  };
}

function normSection(s) {
  return {
    id: +s.id,
    kind: 'section',
    level: 0,
    name: str(s.name, 300) || 'Section',
    color: COLOR_RE.test(s.color) ? s.color : PALETTE[0].color,
    collapsed: !!s.collapsed,
  };
}

function normLog(list, kind) {
  if (!Array.isArray(list)) return [];
  return list
    .filter((e) => e && typeof e === 'object')
    .map((e, i) => {
      const o = { id: Number.isInteger(+e.id) ? +e.id : i + 1 };
      for (const f of LOG_FIELDS[kind]) o[f] = str(e[f], 4000);
      if (!LOG_STATUSES[kind].includes(o.status)) o.status = LOG_STATUSES[kind][0];
      return o;
    });
}

/**
 * Validate and fill defaults on a plan from untrusted JSON. Throws on non-plans.
 * Links that would form a cycle (or point at sections) are removed; pass a
 * `report` object to receive them as `report.droppedLinks`.
 */
function normalizePlan(input, report) {
  if (!input || typeof input !== 'object' || !Array.isArray(input.rows)) {
    throw new Error('Not a planboard plan (missing "rows").');
  }
  const base = createPlan();
  const plan = {
    ...base,
    id: typeof input.id === 'string' && /^[\w-]{1,40}$/.test(input.id) ? input.id : base.id,
    name: str(input.name, 200) || 'Imported plan',
    owner: str(input.owner, 200),
    start: isISODate(input.start) ? input.start : base.start,
    statusDate: isISODate(input.statusDate) ? input.statusDate : '',
    status: pick(input.status, PLAN_STATUSES, 'On track'),
    baselineSavedAt: input.baselineSavedAt ? str(input.baselineSavedAt, 40) : null,
    createdAt: str(input.createdAt, 40) || base.createdAt,
    updatedAt: str(input.updatedAt, 40) || base.updatedAt,
    settings: { ...DEFAULT_SETTINGS },
  };
  const s = input.settings && typeof input.settings === 'object' ? input.settings : {};
  plan.settings.autoSchedule = s.autoSchedule !== false;
  plan.settings.showCritical = !!s.showCritical;
  plan.settings.showBaseline = !!s.showBaseline;
  plan.settings.zoom = pick(s.zoom, ['day', 'week', 'month', 'quarter', 'fit'], 'week');
  plan.settings.dayWidth = Number.isFinite(+s.dayWidth) ? +s.dayWidth : 0;
  plan.settings.labelMode = pick(s.labelMode, ['name', 'owner', 'none'], 'name');
  plan.settings.gridWidth = Number.isFinite(+s.gridWidth) ? +s.gridWidth : 0;
  if (s.columns && typeof s.columns === 'object') {
    const cols = {};
    for (const [k, v] of Object.entries(s.columns)) {
      if (/^\w{1,30}$/.test(k) && v && typeof v === 'object') {
        cols[k] = { visible: v.visible !== false, ...(v.explicit ? { explicit: true } : {}), width: Math.max(30, Math.min(800, +v.width || 0)) || undefined };
      }
    }

  let maxId = 0;

    if (!r || typeof r !== 'object' || !Number.isInteger(+r.id) || +r.id <= 0 || seen.has(+r.id)) continue;

    maxId = Math.max(maxId, +r.id);
    plan.rows.push(r.kind === 'section' ? normSection(r) : normTask(r, plan));
  }
  normalizeLevels(plan.rows);
  for (const r of plan.rows) if (r.kind !== 'section') r.preds = r.preds.filter((p) => seen.has(p.id) && p.id !== r.id);
  plan.nextId = Math.max(maxId + 1, Number.isInteger(+input.nextId) ? +input.nextId : 1);
  const logs = input.logs && typeof input.logs === 'object' ? input.logs : {};

    risks: normLog(logs.risks, 'risks'),
    decisions: normLog(logs.decisions, 'decisions'),
    questions: normLog(logs.questions, 'questions'),
  };
  const dropped = sanitizeLinks(plan.rows);
  if (report) report.droppedLinks = dropped;
  return plan;
}

function serializePlan(plan, pretty = true) {
  return JSON.stringify(plan, null, pretty ? 2 : 0);
}

function parsePlanJSON(text, report) {
  let data;
  try {
    data = JSON.parse(text);
  } catch (e) {
    throw new Error('File is not valid JSON.');
  }
  if (data && data.plan && Array.isArray(data.plan.rows)) data = data.plan;
  return normalizePlan(data, report);
}

function clonePlan(plan) {
  return JSON.parse(JSON.stringify(plan));
}

function saveBaseline(plan) {
  for (const r of plan.rows) if (r.kind !== 'section') r.baseline = { start: r.start, finish: r.finish };
  plan.baselineSavedAt = nowStamp();
}

function clearBaseline(plan) {
  for (const r of plan.rows) if (r.kind !== 'section') r.baseline = null;

}

// ---- model/history.js
const __model_history = (() => {

// Undo/redo snapshots. Each step stores the plan's JSON split into a head and one
// string per row; rows unchanged since the previous snapshot reuse the same string,
// so a step costs only what changed (a 500-task plan is ~400 KB, an edit ~1 KB).

const MAX_HISTORY_STEPS = 200;
const MAX_HISTORY_BYTES = 20 * 1024 * 1024;

function createHistory({ maxSteps = MAX_HISTORY_STEPS, maxBytes = MAX_HISTORY_BYTES } = {}) {
  let cache = new Map();

  /** Snapshot a plan. `bytes` counts only strings not shared with earlier snapshots. */
  function snap(plan) {
    const { rows, ...rest } = plan;
    const head = JSON.stringify(rest);
    const ids = new Array(rows.length);
    const out = new Array(rows.length);
    let chars = head.length;
    if (cache.size > rows.length * 2 + 64) cache = new Map();
    for (let i = 0; i < rows.length; i++) {
      const r = rows[i];
      const j = JSON.stringify(r);
      const c = cache.get(r.id);
      ids[i] = r.id;
      if (c === j) out[i] = c;
      else {
        cache.set(r.id, j);
        out[i] = j;
        chars += j.length;
      }
    }
    return { head, ids, rows: out, bytes: chars * 2 + rows.length * 8 };
  }

  function restore(sn) {
    const plan = JSON.parse(sn.head);
    plan.rows = sn.rows.map((j) => JSON.parse(j));
    return plan;
  }

  function same(a, b) {
    if (a.head !== b.head || a.rows.length !== b.rows.length) return false;
    for (let i = 0; i < a.rows.length; i++) if (a.rows[i] !== b.rows[i]) return false;
    return true;
  }

  /** Push onto a stack, dropping the oldest steps beyond maxSteps / maxBytes. */
  function push(stack, sn) {
    stack.push(sn);
    let total = 0;
    for (const x of stack) total += x.bytes;
    while (stack.length > 1 && (stack.length > maxSteps || total > maxBytes)) total -= stack.shift().bytes;
  }

  const bytes = (stack) => stack.reduce((n, x) => n + x.bytes, 0);

  return { snap, restore, same, push, bytes };
}
return { MAX_HISTORY_STEPS, MAX_HISTORY_BYTES, createHistory };
})();

// ---- ui/state.js
const __ui_state = (() => {
const { computeTree, normalizeLevels, visibleRows } = __model_tree;
const { rollup, autoSchedule, findConflicts, sanitizeLinks } = __schedule_engine;
const { criticalPath } = __schedule_critical;
const { matchTasks } = __model_stats;
const { nowStamp, normalizePlan } = __model_plan;
const { createHistory, MAX_HISTORY_STEPS } = __model_history;
// Application store: current plan, derived schedule data, UI state and undo/redo.







const MAX_UNDO = MAX_HISTORY_STEPS;

function createStore({ plan, storage, readOnly = false, embedded = false, presenter = false, history = {} }) {
  const listeners = new Set();
  const H = createHistory(history);
  const s = {
    plan,
    storage,
    readOnly,
    embedded,
    presenter,
    undoStack: [],
    redoStack: [],
    selection: new Set(),
    active: null, // { id, col }
    anchor: null,
    view: 'plan',
    filter: { text: '', owner: '', status: '', section: '', overdue: false },
    cardId: null,
    d: null,
    saveState: 'saved',
    saveTimer: 0,
  };

  s.on = (fn) => listeners.add(fn);
  s.emit = (kind, data) => listeners.forEach((fn) => fn(kind, data));

  s.derive = (schedule = true) => {
    const rows = s.plan.rows;
    normalizeLevels(rows);
    let tree = computeTree(rows);
    let moved = null;
    if (schedule) {
      rollup(rows, tree);
      if (s.plan.settings.autoSchedule) {
        try {
          moved = autoSchedule(rows, tree);
        } catch (e) {
          const n = sanitizeLinks(rows).length;
          if (n) s.emit('warn', `${n} circular link${n === 1 ? '' : 's'} removed.`);
          tree = computeTree(rows);
          moved = autoSchedule(rows, tree);
        }
      }
    }
    const conflicts = findConflicts(rows, tree);
    const conflictKeys = new Set(conflicts.map((c) => `${c.predId}>${c.succId}`));
    const critical = s.plan.settings.showCritical ? criticalPath(rows, tree) : null;
    const matches = matchTasks(s.plan, tree, s.filter);
    const visible = visibleRows(rows, tree, matches);
    const indexOf = new Map(visible.map((r, i) => [r.id, i]));
    const sectionColor = new Map();
    for (const t of tree.tasks) {
      const sid = tree.sectionOf.get(t.id);
      if (sid != null) sectionColor.set(t.id, tree.byId.get(sid).color);
    }
    s.d = { tree, conflicts, conflictKeys, critical, matches, visible, indexOf, sectionColor, moved };
    for (const id of [...s.selection]) if (!tree.byId.has(id)) s.selection.delete(id);
    if (s.active && !tree.byId.has(s.active.id)) s.active = null;
    if (s.cardId != null && !tree.byId.has(s.cardId)) s.cardId = null;
    return s.d;
  };

  /** UI-only change (selection, filter, view…): re-derive cheap parts and re-render. */
  s.ui = (rederive = false) => {
    if (rederive) s.derive(false);
    s.emit('change');
  };

  s.persist = () => {
    if (s.readOnly || !s.storage) return;
    s.saveState = 'saving';
    clearTimeout(s.saveTimer);
    s.saveTimer = setTimeout(() => {
      s.saveState = s.storage.save(s.plan) ? 'saved' : 'error';
      s.emit('saved', s.saveState);
    }, 250);
  };

  s.flush = () => {
    if (s.saveState === 'saving' && !s.readOnly && s.storage) {
      clearTimeout(s.saveTimer);
      s.saveState = s.storage.save(s.plan) ? 'saved' : 'error';
    }
  };

  /**
   * Mutate the plan inside fn(plan). Return false from fn (before mutating) to abort,
   * or a string to abort with a message. Options: undo, schedule, touch.
   */
  s.commit = (label, fn, opts = {}) => {
    const { undo = true, schedule = true, touch = true, allowReadOnly = false } = opts;
    if (s.readOnly && !allowReadOnly) {
      s.emit('readonly');
      return false;
    }
    const before = H.snap(s.plan);
    let res;
    try {
      res = fn(s.plan);
    } catch (e) {
      s.plan = H.restore(before);
      s.derive(false);
      s.emit('error', e.message || String(e));
      return false;
    }
    if (res === false || typeof res === 'string') {
      s.plan = H.restore(before);
      s.derive(false);
      if (typeof res === 'string') s.emit('error', res);
      s.emit('change');
      return false;
    }
    s.derive(schedule);
    const after = H.snap(s.plan);
    if (H.same(before, after)) {
      s.emit('change');
      return true;
    }
    const stamp = nowStamp();
    if (touch) {
      const rowsBefore = new Map(before.ids.map((id, i) => [id, before.rows[i]]));
      s.plan.rows.forEach((r, i) => {
        if (r.kind === 'section') return;
        const b = rowsBefore.get(r.id);
        if (b != null && b !== after.rows[i]) r.updatedAt = stamp;
      });
    }
    s.plan.updatedAt = stamp;
    if (undo) {
      H.push(s.undoStack, before);
      s.redoStack.length = 0;
    }
    s.lastLabel = label;
    s.persist();
    s.emit('change', { label, moved: s.d.moved });
    return true;
  };

  const restore = (from, to) => {
    if (s.readOnly || !from.length) return false;
    H.push(to, H.snap(s.plan));
    s.plan = normalizePlan(H.restore(from.pop()));
    s.derive(false);
    s.persist();
    s.emit('change');
    return true;
  };
  s.historyBytes = () => H.bytes(s.undoStack) + H.bytes(s.redoStack);
  s.undo = () => restore(s.undoStack, s.redoStack);
  s.redo = () => restore(s.redoStack, s.undoStack);

  /** Replace the whole plan (switch / import). Clears history. */
  s.load = (plan, opts = {}) => {
    s.plan = plan;
    s.undoStack = [];
    s.redoStack = [];
    s.selection.clear();
    s.active = null;
    s.cardId = null;
    s.derive(true);
    if (opts.save !== false) s.persist();
    s.emit('load');
    s.emit('change');
  };

  s.derive(true);
  return s;
}
return { MAX_UNDO, createStore };
})();

// ---- io/storage.js
const __io_storage = (() => {
const { normalizePlan, serializePlan } = __model_plan;
// Plan persistence in localStorage: one key per plan plus an index. The backing
// store is injectable so this module stays testable in Node.


const PREFIX = 'planboard:';
const INDEX = PREFIX + 'index';
const PREFS = PREFIX + 'prefs';

function memoryStore() {
  const m = new Map();
  return {
    getItem: (k) => (m.has(k) ? m.get(k) : null),
    setItem: (k, v) => m.set(k, String(v)),
    removeItem: (k) => m.delete(k),
  };
}

function defaultStore() {
  try {
    const s = globalThis.localStorage;
    const k = PREFIX + 'probe';
    s.setItem(k, '1');
    s.removeItem(k);
    return { store: s, persistent: true };
  } catch (e) {
    return { store: memoryStore(), persistent: false };
  }
}

function createStorage(store = memoryStore()) {
  const readJSON = (k, dflt) => {
    try {
      const v = store.getItem(k);
      return v ? JSON.parse(v) : dflt;
    } catch (e) {
      return dflt;
    }
  };
  const api = {
    index() {
      const idx = readJSON(INDEX, null);
      return idx && Array.isArray(idx.plans) ? idx : { current: null, plans: [] };
    },
    writeIndex(idx) {
      store.setItem(INDEX, JSON.stringify(idx));
    },
    list() {
      return api.index().plans;
    },
    load(id) {
      const raw = readJSON(PREFIX + 'plan:' + id, null);
      if (!raw) return null;
      try {
        return normalizePlan(raw);
      } catch (e) {
        return null;
      }
    },
    /** Returns false when the browser refuses (quota). */
    save(plan) {
      try {
        store.setItem(PREFIX + 'plan:' + plan.id, serializePlan(plan, false));
        const idx = api.index();
        const entry = { id: plan.id, name: plan.name, updatedAt: plan.updatedAt };
        const i = idx.plans.findIndex((p) => p.id === plan.id);
        if (i >= 0) idx.plans[i] = entry;
        else idx.plans.push(entry);
        idx.current = plan.id;
        api.writeIndex(idx);
        return true;
      } catch (e) {
        return false;
      }
    },
    remove(id) {
      store.removeItem(PREFIX + 'plan:' + id);
      const idx = api.index();
      idx.plans = idx.plans.filter((p) => p.id !== id);
      if (idx.current === id) idx.current = idx.plans.length ? idx.plans[0].id : null;
      api.writeIndex(idx);
    },
    setCurrent(id) {
      const idx = api.index();
      idx.current = id;
      api.writeIndex(idx);
    },
    prefs() {
      return readJSON(PREFS, {});
    },
    setPrefs(p) {
      try {
        store.setItem(PREFS, JSON.stringify({ ...api.prefs(), ...p }));
      } catch (e) {
        /* ignore */
      }
    },
  };
  return api;
}
return { defaultStore, createStorage };
})();

const __ui_gantt_scale = (() => {

    if (kind === 'month') d = fromYMD(y, m, 1);
    else if (kind === 'quarter') d = fromYMD(y, m - ((m - 1) % 3), 1);
    else d = fromYMD(y, 1, 1);

    if (kind === 'day') n = d + 1;
    else if (kind === 'week') n = d + 7;
    else {
      const [y, m] = toYMD(d);
      const step = kind === 'month' ? 1 : kind === 'quarter' ? 3 : 12;
      n = fromYMD(y + Math.floor((m - 1 + step) / 12), ((m - 1 + step) % 12) + 1, 1);

  const x2 = Math.max(x1 + 3, (f + 1) * ppd);
  return { x1, x2, cx: (x1 + x2) / 2, ms: false };
}

/** Orthogonal arrow path with a distinct route per link type. */
function linkPath(type, a, b, rowH) {
  const e = 8;
  const fromStart = type === 'SS' || type === 'SF';
  const toStart = type === 'FS' || type === 'SS';
  const px = r1(fromStart ? a.x1 : a.x2);
  const sx = r1(toStart ? b.x1 : b.x2);
  const py = a.y;
  const sy = b.y;
  const dir = sy >= py ? 1 : -1;
  const midY = r1(sy - (dir * rowH) / 2);
  if (type === 'SS') return `M${px},${py}H${r1(Math.min(px, sx) - e)}V${sy}H${sx}`;
  if (type === 'FF') return `M${px},${py}H${r1(Math.max(px, sx) + e)}V${sy}H${sx}`;
  if (type === 'SF') {
    const ox = px - e;
    if (ox >= sx + e) return `M${px},${py}H${ox}V${sy}H${sx}`;
    return `M${px},${py}H${ox}V${midY}H${sx + e}V${sy}H${sx}`;
  }
  const ox = px + e;
  if (ox <= sx - 2) return `M${px},${py}H${ox}V${sy}H${sx}`;
  return `M${px},${py}H${ox}V${midY}H${sx - e}V${sy}H${sx}`;
}

function renderHeader(range, ppd, width, opts = {}) {
  const t = ticks(range, ppd);
  const h = HEADER_H;
  const out = [`<rect class="hb" x="0" y="0" width="${width}" height="${h}"/>`];
  for (const k of t.top) {
    out.push(`<line class="hl" x1="${r1(k.x)}" y1="0" x2="${r1(k.x)}" y2="${h}"/>`);
    const vx = Math.max(k.x, 0);
    if (k.x + k.w - vx > String(k.label).length * 7 + 10) out.push(`<text class="ht" x="${r1(vx + 5)}" y="16">${esc(k.label)}</text>`);
  }
  for (const k of t.bottom) {
    out.push(`<line class="hl" x1="${r1(k.x)}" y1="22" x2="${r1(k.x)}" y2="${h}"/>`);
    if (k.w >= 12 && (k.w < 30 || k.x + k.w - Math.max(k.x, 0) > String(k.label).length * 6 + 8)) {
      const tx = k.w < 30 ? k.x + k.w / 2 : Math.max(k.x, 0) + 4;
      out.push(`<text class="hs" x="${r1(tx)}" y="37"${k.w < 30 ? ' text-anchor="middle"' : ''}>${esc(k.label)}</text>`);
    }
  }
  out.push(`<line class="hl" x1="0" y1="22" x2="${width}" y2="22"/><line class="hl" x1="0" y1="${h - 0.5}" x2="${width}" y2="${h - 0.5}"/>`);
  if (opts.todayDay != null && opts.todayDay >= range.start && opts.todayDay <= range.end) {
    const x = r1((opts.todayDay - range.start + 0.5) * ppd);
    out.push(`<line class="today" x1="${x}" y1="22" x2="${x}" y2="${h}"/>`);
  }
  return out.join('');
}

/**
 * o: { rows (display list), tree, from, to, range, ppd, rowH, header (bool),
 *      indexOf: Map id→display index, sectionColor: Map id→colour, critical, conflicts: Set "p>s",
 *      showBaseline, labelMode, selection: Set, todayDay, interactive, prefix, styles (css string) }
 */
function renderGantt(o) {
  const { rows, tree, range, ppd, rowH } = o;
  const from = o.from || 0;
  const to = Math.min(o.to == null ? rows.length : o.to, rows.length);
  const headerH = o.header ? HEADER_H : 0;
  const width = Math.ceil((range.end - range.start + 1) * ppd);
  const height = headerH + Math.max(0, to - from) * rowH;
  const p = o.prefix || 'g';
  const y0 = (i) => headerH + (i - from) * rowH;
  const crit = o.critical;
  const out = [];
  out.push(
    `<svg xmlns="http://www.w3.org/2000/svg" class="gsvg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">`
  );
  if (o.styles) out.push(`<style>${o.styles}</style>`);
  const marker = (id, cls) =>
    `<marker id="${p}-${id}" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="${cls}" d="M0,0.5L8,4L0,7.5z"/></marker>`;
  out.push(`<defs>${marker('m', 'mk')}${marker('mc', 'mk-c')}${marker('mx', 'mk-x')}${marker('mh', 'mk-h')}`);
  const showWeekends = ppd >= 2.8;
  if (showWeekends) {
    let sat = range.start;
    while (weekday(sat) !== 5) sat++;
    out.push(
      `<pattern id="${p}-we" patternUnits="userSpaceOnUse" x="${r1((sat - range.start) * ppd)}" y="0" width="${r1(7 * ppd)}" height="${rowH}"><rect class="we" width="${r1(2 * ppd)}" height="${rowH}"/></pattern>`
    );
  }
  out.push('</defs>');

  // background: section tints, weekends, grid lines, today
  const bg = [];
  for (let i = from; i < to; i++) {
    const r = rows[i];
    const col = r.kind === 'section' ? r.color : o.sectionColor && o.sectionColor.get(r.id);
    if (col) bg.push(`<rect class="${r.kind === 'section' ? 'sr' : 'tr'}" x="0" y="${y0(i)}" width="${width}" height="${rowH}" style="fill:${col}"/>`);
  }
  out.push(bg.join(''));
  if (showWeekends) out.push(`<rect x="0" y="${headerH}" width="${width}" height="${height - headerH}" fill="url(#${p}-we)"/>`);
  const tk = ticks(range, ppd);
  const gl = [];
  for (const k of tk.bottom) gl.push(`<line class="gl" x1="${r1(k.x)}" y1="${headerH}" x2="${r1(k.x)}" y2="${height}"/>`);
  out.push(gl.join(''));
  if (o.todayDay != null && o.todayDay >= range.start && o.todayDay <= range.end) {
    const x = r1((o.todayDay - range.start + 0.5) * ppd);
    out.push(`<line class="today" x1="${x}" y1="${headerH}" x2="${x}" y2="${height}"/>`);
  }

  // links
  const idx = o.indexOf;
  const geom = new Map();
  const g = (id) => {
    if (!geom.has(id)) {
      const t = tree.byId.get(id);
      const b = barGeom(t, range, ppd);
      b.y = r1(y0(idx.get(id)) + rowH / 2);
      geom.set(id, b);
    }
    return geom.get(id);
  };
  const links = [];
  for (let i = 0; i < rows.length; i++) {
    const t = rows[i];
    if (t.kind === 'section' || !t.preds || !t.preds.length) continue;
    for (const l of t.preds) {
      const pi = idx.get(l.id);
      if (pi == null) continue;
      if (Math.max(pi, i) < from || Math.min(pi, i) >= to) continue;
      const key = `${l.id}>${t.id}`;
      const isConf = o.conflicts && o.conflicts.has(key);
      const isCrit = !isConf && crit && crit.links.has(key);
      const d = linkPath(l.type, g(l.id), g(t.id), rowH);
      const m = isConf ? 'mx' : isCrit ? 'mc' : 'm';
      links.push(
        `<g class="lk${isCrit ? ' crit' : ''}${isConf ? ' conf' : ''}" data-link="${key}">${o.interactive ? `<path class="hit" d="${d}"/>` : ''}<path class="ln" d="${d}" marker-end="url(#${p}-${m})"/>${o.interactive ? `<title>${esc(linkTitle(tree, l, t))}</title>` : ''}</g>`
      );
    }
  }
  out.push(`<g class="links">${links.join('')}</g>`);

  // bars
  const bh = Math.round(rowH * 0.56);
  const bars = [];
  for (let i = from; i < to; i++) {
    const t = rows[i];
    if (t.kind === 'section') continue;
    const y = y0(i);
    const cy = y + rowH / 2;
    const b = barGeom(t, range, ppd);
    const summary = tree.isSummary(t.id);
    const cls = ['bar', summary ? 'sum' : '', b.ms ? 'ms' : '', crit && crit.tasks.has(t.id) ? 'crit' : '', o.selection && o.selection.has(t.id) ? 'sel' : '']
      .filter(Boolean)
      .join(' ');
    const color = !summary && !b.ms && o.sectionColor && o.sectionColor.get(t.id);
    const fill = color ? ` style="fill:${color}"` : '';
    const parts = [];
    if (o.showBaseline && t.baseline) {
      const bb = barGeom({ start: t.baseline.start, finish: t.baseline.finish, milestone: t.milestone }, range, ppd);
      if (b.ms) parts.push(`<path class="bl" d="M${r1(bb.cx)},${r1(y + rowH - 9)}l4,4l-4,4l-4,-4z"/>`);
      else parts.push(`<rect class="bl" x="${r1(bb.x1)}" y="${r1(y + rowH - 6)}" width="${r1(bb.x2 - bb.x1)}" height="4" rx="1"/>`);
    }
    if (b.ms) {
      const r = 7;
      parts.push(`<path class="b" d="M${r1(b.cx)},${r1(cy - r)}L${r1(b.cx + r)},${r1(cy)}L${r1(b.cx)},${r1(cy + r)}L${r1(b.cx - r)},${r1(cy)}z"/>`);
    } else if (summary) {
      const ty = r1(cy - 5);
      const h = 7;
      const x1 = r1(b.x1);
      const x2 = r1(b.x2);
      const tip = Math.min(5, (x2 - x1) / 2);
      parts.push(`<path class="b" d="M${x1},${ty}H${x2}V${ty + h + 5}L${r1(x2 - tip)},${ty + h}H${r1(x1 + tip)}L${x1},${ty + h + 5}z"/>`);
      if (t.progress > 0) parts.push(`<rect class="pg" x="${x1}" y="${ty + 2}" width="${r1(((x2 - x1) * t.progress) / 100)}" height="3"/>`);
    } else {
      const by = r1(cy - bh / 2);
      const w = r1(b.x2 - b.x1);
      parts.push(`<rect class="b" x="${r1(b.x1)}" y="${by}" width="${w}" height="${bh}" rx="3"${fill}/>`);
      if (t.progress > 0) parts.push(`<rect class="pg" x="${r1(b.x1)}" y="${r1(cy + bh / 2 - 4)}" width="${r1((w * t.progress) / 100)}" height="4" rx="1"/>`);
      if (o.interactive) parts.push(`<rect class="rz" x="${r1(b.x2 - 5)}" y="${by}" width="7" height="${bh}"/>`);
    }
    if (o.interactive) {
      parts.push(`<circle class="hd" data-h="start" cx="${r1(b.x1 - 7)}" cy="${r1(cy)}" r="4.5"><title>Drag to link from start</title></circle>`);
      parts.push(`<circle class="hd" data-h="finish" cx="${r1(b.x2 + 7)}" cy="${r1(cy)}" r="4.5"><title>Drag to link from finish</title></circle>`);
    }
    const text = o.labelMode === 'owner' ? t.owner : o.labelMode === 'none' ? '' : t.name;
    if (text) parts.push(`<text class="lbl" x="${r1(b.x2 + (o.interactive ? 15 : 6))}" y="${r1(cy + 4)}">${esc(text)}</text>`);
    bars.push(`<g class="${cls}" data-id="${t.id}">${parts.join('')}</g>`);
  }
  out.push(`<g class="bars">${bars.join('')}</g>`);
  if (o.header) out.push(renderHeader(range, ppd, width, { todayDay: o.todayDay }));
  out.push('</svg>');
  return { svg: out.join(''), width, height };
}

const TYPE_NAMES = { FS: 'Finish → Start', SS: 'Start → Start', FF: 'Finish → Finish', SF: 'Start → Finish' };
function linkTitle(tree, l, succ) {
  const lag = l.lag ? ` ${l.lag > 0 ? '+' : ''}${l.lag}d` : '';
  return `${tree.outline.get(l.id)} → ${tree.outline.get(succ.id)}: ${TYPE_NAMES[l.type]}${lag} (click to edit)`;
}
return { HEADER_H, GANTT_CSS, barGeom, linkPath, renderHeader, renderGantt };
})();

// ---- ui/format.js
const __ui_format = (() => {
const { parseISO, toYMD, weekday } = __schedule_calendar;
// Display formatting (dates are formatted from day numbers, never via local Date parsing).


const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const WD = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

/** "Mon 5 Oct" (year appended when it differs from refYear). */
function fmtDate(iso, refYear) {
  const d = parseISO(iso);
  if (Number.isNaN(d)) return '';
  const [y, m, dd] = toYMD(d);
  return `${WD[weekday(d)]} ${dd} ${MON[m - 1]}${refYear && y !== refYear ? ` ${y}` : ''}`;
}

function fmtDateLong(iso) {
  const d = parseISO(iso);
  if (Number.isNaN(d)) return '—';
  const [y, m, dd] = toYMD(d);
  return `${WD[weekday(d)]} ${dd} ${MON[m - 1]} ${y}`;
}

function fmtStamp(stamp) {
  if (!stamp) return '—';
  const t = new Date(stamp);
  return Number.isNaN(t.getTime()) ? '—' : t.toLocaleString();
}

function fmtVariance(v) {
  if (v == null) return '';
  if (v === 0) return '0d';
  return `${v > 0 ? '+' : ''}${v}d`;
}

const statusSlug = (s) => String(s).toLowerCase().replace(/\s+/g, '-');
return { fmtDate, fmtDateLong, fmtStamp, fmtVariance, statusSlug };
})();

  const leaves = [];

  walk(id);

  root.innerHTML = `<div class="gt-scroll" aria-label="Gantt chart"><div class="gt-head"></div><div class="gt-body"><div class="gt-win"></div><svg class="gt-over" aria-hidden="true"><path class="gt-tmp" d=""/></svg><div class="gt-tip" hidden></div></div></div>`;
  const scroll = root.querySelector('.gt-scroll');
  const head = root.querySelector('.gt-head');
  const body = root.querySelector('.gt-body');
  const winEl = root.querySelector('.gt-win');
  const over = root.querySelector('.gt-over');
  const tmp = root.querySelector('.gt-tmp');
  const tip = root.querySelector('.gt-tip');
  let range = null;
  let ppd = 16;
  let width = 0;
  let win = { from: -1, to: -1 };
  let lastZoom = null;
  let firstRender = true;

  const rowH = () => app.rowH();

  function layout() {
    const d = store.d;
    range = projectRange(d.tree.tasks, app.todayDay());
    const z = store.plan.settings.zoom;
    ppd = z === 'fit' ? fitPpd(range, Math.max(200, scroll.clientWidth - 4)) : ZOOMS[z] || ZOOMS.week;
    width = Math.ceil((range.end - range.start + 1) * ppd);
  }

  function render() {
    const prev = range && { start: range.start, ppd };
    const centerDay = prev ? prev.start + (scroll.scrollLeft + scroll.clientWidth / 2) / prev.ppd : null;
    layout();
    head.style.width = `${width}px`;
    head.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="gsvg" width="${width}" height="${HEADER_H}">${renderHeader(range, ppd, width, { todayDay: app.todayDay() })}</svg>`;
    body.style.width = `${width}px`;
    body.style.height = `${store.d.visible.length * rowH() + 40}px`;
    over.setAttribute('width', width);
    over.setAttribute('height', store.d.visible.length * rowH() + 40);
    const zoomKey = `${store.plan.settings.zoom}:${ppd.toFixed(3)}`;
    if (firstRender) {
      firstRender = false;
      requestAnimationFrame(() => scrollToDay(app.todayDay() - 7 * (ppd >= 10 ? 1 : 4), 'start'));
    } else if (lastZoom && zoomKey !== lastZoom && centerDay != null) {
      scroll.scrollLeft = Math.max(0, (centerDay - range.start) * ppd - scroll.clientWidth / 2);
    } else if (prev && prev.start !== range.start) {
      scroll.scrollLeft += (prev.start - range.start) * ppd;
    }
    lastZoom = zoomKey;
    renderWindow(true);
  }

  function renderWindow(force) {
    if (!range) return;
    const h = rowH();
    const n = store.d.visible.length;
    const first = Math.floor(scroll.scrollTop / h);
    const from = Math.max(0, first - OVERSCAN);
    const to = Math.min(n, first + Math.ceil(scroll.clientHeight / h) + OVERSCAN);
    if (!force && from === win.from && to === win.to) return;
    win = { from, to };
    const d = store.d;
    const s = store.plan.settings;
    const { svg } = renderGantt({
      rows: d.visible,
      tree: d.tree,
      from,
      to,
      range,
      ppd,
      rowH: h,
      indexOf: d.indexOf,
      sectionColor: d.sectionColor,
      critical: d.critical,
      conflicts: d.conflictKeys,
      showBaseline: s.showBaseline,
      labelMode: s.labelMode,
      selection: store.selection,
      todayDay: app.todayDay(),
      interactive: !store.readOnly,
      prefix: 'g',
    });
    winEl.style.top = `${from * h}px`;
    winEl.innerHTML = svg;
  }

  function scrollToDay(day, where = 'center') {
    if (!range) return;
    const x = (day - range.start) * ppd;
    scroll.scrollLeft = Math.max(0, where === 'start' ? x : x - scroll.clientWidth / 2);
  }

  // ---- pointer interactions ---------------------------------------------
  let act = null;
  let suppressClick = false;
  const bodyPoint = (e) => {
    const r = body.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  };
  const showTip = (text, p) => {
    tip.hidden = false;
    tip.textContent = text;
    tip.style.left = `${p.x + 14}px`;
    tip.style.top = `${p.y + 16}px`;
  };

  winEl.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    const bar = e.target.closest('.bar');
    if (!bar) return;
    const id = Number(bar.dataset.id);
    const t = store.d.tree.byId.get(id);
    if (!t) return;
    if (store.readOnly) return;
    const cl = e.target.classList;
    const summary = store.d.tree.isSummary(id);
    const mode = cl.contains('hd') ? 'link' : cl.contains('rz') && !summary && !t.milestone ? 'resize' : 'move';
    const rect = bar.querySelector('rect.b');
    act = {
      mode, id, t, bar, x0: e.clientX, y0: e.clientY, dd: 0, moved: false, handle: e.target.dataset.h,
      w0: rect ? Number(rect.getAttribute('width')) : 0, rect,
      hx: cl.contains('hd') ? Number(e.target.getAttribute('cx')) : 0,
      hy: cl.contains('hd') ? Number(e.target.getAttribute('cy')) + win.from * rowH() : 0,
    };
    e.preventDefault();
    try {
      winEl.setPointerCapture(e.pointerId);
    } catch (err) {
      /* ignore */
    }
  });

  winEl.addEventListener('pointermove', (e) => {
    if (!act) return;
    const dx = e.clientX - act.x0;
    if (!act.moved && Math.abs(dx) < 4 && Math.abs(e.clientY - act.y0) < 4) return;
    act.moved = true;
    const p = bodyPoint(e);
    if (act.mode === 'move') {
      act.dd = Math.round(dx / ppd);
      act.bar.setAttribute('transform', `translate(${act.dd * ppd},0)`);
      const ns = nextWorkday(parseISO(act.t.start) + act.dd);
      showTip(`Start ${fmtDateLong(toISO(ns))}`, p);
    } else if (act.mode === 'resize') {
      act.dd = Math.round(dx / ppd);
      if (act.rect) act.rect.setAttribute('width', Math.max(ppd, act.w0 + act.dd * ppd));
      const nf = Math.max(parseISO(act.t.start), prevWorkday(parseISO(act.t.finish) + act.dd));
      showTip(`Finish ${fmtDateLong(toISO(nf))}`, p);
    } else {
      tmp.setAttribute('d', `M${act.hx},${act.hy}L${p.x},${p.y}`);
      winEl.querySelectorAll('.link-target').forEach((n) => n.classList.remove('link-target'));
      const tgt = targetBar(e);
      if (tgt && tgt.id !== act.id) {
        tgt.el.classList.add('link-target');
        showTip(`${linkType(act.handle, tgt, p)} link to ${store.d.tree.outline.get(tgt.id)}`, p);
      } else tip.hidden = true;
    }
  });

  function targetBar(e) {
    const n = document.elementFromPoint(e.clientX, e.clientY);
    const el = n && n.closest && n.closest('.gt-win .bar');
    return el ? { el, id: Number(el.dataset.id) } : null;
  }
  function linkType(handle, tgt, p) {
    const t = store.d.tree.byId.get(tgt.id);
    const g = barGeom(t, range, ppd);
    const toStart = p.x < g.cx;
    const fromStart = handle === 'start';
    return fromStart ? (toStart ? 'SS' : 'SF') : toStart ? 'FS' : 'FF';
  }

  const finish = (e, cancel) => {
    if (!act) return;
    const a = act;
    act = null;
    tip.hidden = true;
    tmp.setAttribute('d', '');
    winEl.querySelectorAll('.link-target').forEach((n) => n.classList.remove('link-target'));
    if (!a.moved) {
      if (a.mode !== 'link') app.select(a.id, { col: 'name', keepCard: true });
      return;
    }
    suppressClick = true;
    setTimeout(() => (suppressClick = false), 0);
    if (cancel) return renderWindow(true);
    if (a.mode === 'move') {
      if (!a.dd) return renderWindow(true);
      store.commit('Move task', (plan) => (moveTaskBy(plan.rows, a.id, a.dd) ? undefined : false));
    } else if (a.mode === 'resize') {
      if (!a.dd) return renderWindow(true);
      store.commit('Resize task', (plan) => {
        const t = plan.rows.find((r) => r.id === a.id);
        resizeTaskTo(t, prevWorkday(parseISO(t.finish) + a.dd));
      });
    } else {
      const tgt = targetBar(e);
      if (!tgt || tgt.id === a.id) return undefined;
      const type = linkType(a.handle, tgt, bodyPoint(e));
      const ok = store.commit('Add link', (plan) => addLink(plan.rows, a.id, tgt.id, type, 0) || undefined);
      if (ok) {
        const o = store.d.tree.outline;
        app.toast(`Linked ${o.get(a.id)} → ${o.get(tgt.id)} (${type}). Click the arrow to change type or lag.`);
      }
    }
    return undefined;
  };
  winEl.addEventListener('pointerup', (e) => finish(e, false));
  winEl.addEventListener('pointercancel', (e) => finish(e, true));
  winEl.addEventListener('lostpointercapture', (e) => act && finish(e, false));

  winEl.addEventListener('click', (e) => {
    if (suppressClick) return;
    const lk = e.target.closest('.lk');
    if (lk) {
      const [p, s] = lk.dataset.link.split('>').map(Number);
      openLinkEditor(app, p, s);
      return;
    }
    if (store.readOnly) {
      const bar = e.target.closest('.bar');
      if (bar) app.select(Number(bar.dataset.id), { col: 'name', keepCard: true });
    }
  });
  winEl.addEventListener('dblclick', (e) => {
    const bar = e.target.closest('.bar');
    if (bar) app.openCard(Number(bar.dataset.id));
  });

  scroll.addEventListener('scroll', () => {
    app.syncScroll('gantt', scroll.scrollTop);
    renderWindow();
  });

  return {
    el: root,
    render,
    renderWindow,
    scrollToDay,
    metrics: () => ({ range, ppd, width }),
    setScrollTop(top) {
      if (Math.abs(scroll.scrollTop - top) > 0.5) scroll.scrollTop = top;
      renderWindow();
    },
  };
}
return { createGantt };
})();

const __util_markdown = (() => {
const { escapeHtml } = __util_escape;
// Tiny markdown subset: **bold**, *italic* / _italic_, `code`, [links](https://…),
// bare URLs, "- " / "* " bullet lists, paragraphs and line breaks.
// Input is escaped first, so raw HTML can never get through; only http(s) and
// mailto links become <a> elements.


const SAFE_URL = /^(https?:\/\/|mailto:)[^\s"'<>`]+$/i;

function safeUrl(url) {
  const u = String(url || '').trim();
  return SAFE_URL.test(u) ? u : null;
}

function unescapeEntities(s) {
  return s
    .replace(/&lt;/g, '<')
    .replace(/&gt;/g, '>')
    .replace(/&quot;/g, '"')
    .replace(/&#39;/g, "'")
    .replace(/&amp;/g, '&');
}

function link(text, rawUrl) {
  const url = safeUrl(unescapeEntities(rawUrl));
  if (!url) return text;
  return `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${text}</a>`;
}

function inline(escaped) {
  const codes = [];
  let s = escaped.replace(/`([^`]+)`/g, (_, c) => {
    codes.push(`<code>${c}</code>`);
    return `\u0000${codes.length - 1}\u0000`;
  });
  const links = [];
  const stash = (html) => {
    links.push(html);
    return `\u0001${links.length - 1}\u0001`;
  };
  s = s.replace(/\[([^\]]+)\]\(((?:[^()\s]|\([^()\s]*\))+)\)/g, (_, t, u) => stash(link(t, u)));
  s = s.replace(/(^|[\s(])((?:https?:\/\/|mailto:)[^\s<]+[^\s<.,;:!?)])/gi, (_, pre, u) => pre + stash(link(u, u)));
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g, '$1<em>$2</em>');
  s = s.replace(/(^|[^_\w])_([^_\s][^_]*?)_(?!\w)/g, '$1<em>$2</em>');
  s = s.replace(/\u0001(\d+)\u0001/g, (_, i) => links[+i]);
  s = s.replace(/\u0000(\d+)\u0000/g, (_, i) => codes[+i]);
  return s;
}

/** Render the markdown subset to safe HTML. */
function renderMarkdown(src) {
  // Control characters are dropped up front: they are never meaningful in a
  // description and \u0000 / \u0001 are used as placeholders below.
  const text = String(src == null ? '' : src).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, '');
  const lines = text.replace(/\r\n?/g, '\n').split('\n');
  const out = [];
  let para = [];
  let list = null;
  const flushPara = () => {
    if (para.length) out.push(`<p>${para.map((l) => inline(escapeHtml(l))).join('<br>')}</p>`);
    para = [];
  };
  const flushList = () => {
    if (list) out.push(`<ul>${list.map((l) => `<li>${inline(escapeHtml(l))}</li>`).join('')}</ul>`);
    list = null;
  };
  for (const line of lines) {
    const m = /^\s*[-*•]\s+(.*)$/.exec(line);
    if (m) {
      flushPara();
      (list = list || []).push(m[1]);
    } else if (!line.trim()) {
      flushPara();
      flushList();
    } else {
      flushList();
      para.push(line);
    }
  }
  flushPara();
  flushList();
  return out.join('');
}
return { safeUrl, renderMarkdown };
})();

  async function readFile(file) {
    if (store.readOnly) return store.emit('readonly');
    if (file.size > 20 * 1024 * 1024) return toast('That file is too large (over 20 MB).', 'error');
    const text = await file.text();
    return importText(text, file.name);
  }

  async function importText(text, name = '') {
    const lower = name.toLowerCase();
    if (/\.(csv|tsv|txt)$/.test(lower)) return openPasteImport(app, text);
    let p;
    const report = {};
    try {
      if (/\.html?$/.test(lower) || /^\s*</.test(text)) {
        const payload = extractPayload(text);
        if (!payload || !payload.plan) throw new Error('this HTML file has no embedded plan');
        p = normalizePlan(payload.plan, report);
      } else p = parsePlanJSON(text, report);
    } catch (e) {
      return toast(`Import failed: ${e.message}`, 'error', 7000);
    }
    const existing = storage.load(p.id);
    if (existing) {
      const r = await modal({
        title: 'Plan already exists',
        body: `<p>This browser already has a plan with the same ID: “${esc(existing.name)}” (saved ${esc(fmtStamp(existing.updatedAt))}).</p>`,
        actions: [{ label: 'Cancel', value: 'cancel' }, { label: 'Import as copy', value: 'copy' }, { label: 'Replace it', value: 'replace', primary: true }],
      });
      if (r.value === 'cancel') return undefined;
      if (r.value === 'copy') {
        p.id = uid();
        p.name = `${p.name} (imported)`.slice(0, 200);
      }
    }
    addPlan(p);
    toast(`Imported “${p.name}”.${droppedNote(report)}`, report.droppedLinks.length ? 'warn' : 'info', 6000);
    return undefined;
  }

  const exportJSON = () => download(safeFilename(store.plan.name, 'json'), serializePlan(store.plan), 'application/json');
  const exportCSV = () => download(safeFilename(store.plan.name, 'csv'), toCSV(store.plan, store.d.tree), 'text/csv;charset=utf-8');
  function droppedNote(report) {
    const n = (report.droppedLinks || []).length;
    return n ? ` ${n} circular or invalid link${n === 1 ? ' was' : 's were'} removed.` : '';
  }

  // "Save to file": this HTML with the current plan embedded as an editable copy,
  // so the plan travels inside the file itself.
  function saveToFile() {
    if (store.readOnly) return store.emit('readonly');
    store.flush();
    const payload = { app: 'planboard', readOnly: false, presenter: false, savedAt: new Date().toISOString(), plan: JSON.parse(serializePlan(store.plan, false)) };
    const name = safeFilename(store.plan.name, 'html');
    download(name, embedPayload(sourceHtml, payload), 'text/html;charset=utf-8');
    toast(`Saved “${name}”. Opening that file restores this plan, ready to edit.`, 'info', 6000);
    return undefined;
  }

  function showBanner(text) {
    q('.banner-text').textContent = text;
    q('.banner').hidden = false;
  }
  const hideBanner = () => {
    q('.banner').hidden = true;
  };

  async function useFileVersion() {
    const f = opened && opened.file;
    if (!f) return;
    if (!f.readOnly && !(await confirmBox('Open the version stored in this file? Your newer edits saved in this browser will be replaced by it.', { ok: 'Use file version', danger: true }))) return;
    hideBanner();
    store.flush();
    store.readOnly = f.readOnly;
    store.presenter = f.presenter;
    const p = clonePlan(f.plan);
    if (f.readOnly) store.load(p, { save: false });
    else addPlan(p);
    toast(f.readOnly ? 'Showing the file version (read-only). Your saved edits are still in this browser.' : 'Showing the file version.', 'info', 5000);
  }

  function exportStandalone() {
    const payload = { app: 'planboard', readOnly: true, presenter: true, exportedAt: new Date().toISOString(), plan: JSON.parse(serializePlan(store.plan, false)) };
    download(safeFilename(store.plan.name, 'html'), embedPayload(sourceHtml, payload), 'text/html;charset=utf-8');
    toast('Standalone copy downloaded. It opens read-only in presenter mode; “Unlock editing” makes it editable.', 'info', 6000);
  }
  function exportPNG() {
    const go = () => exportGanttPNG(app).then(() => toast('Gantt PNG downloaded.')).catch((e) => toast(e.message, 'error'));
    if (store.view !== 'plan') {
      setView('plan');
      setTimeout(go, 50);
    } else go();
  }
  function printPlan() {
    buildPrint(app, printRoot);
    window.print();
  }
  window.addEventListener('beforeprint', () => buildPrint(app, printRoot));
  window.addEventListener('afterprint', () => clearPrint(printRoot));

  function fileMenu(anchor) {
    const ro = store.readOnly;
    const items = [];
    if (!ro) {
      items.push(
        { heading: 'Plan' },
        { label: 'New plan…', action: newPlan },
        { label: 'Duplicate plan', action: duplicatePlan },
        { label: 'Rename plan…', action: renamePlan },
        { label: 'Delete plan…', danger: true, action: deletePlan },
        { sep: true },
        { heading: 'Import' },
        { label: 'Import JSON file…', hint: 'or drop a file', action: pickFile },
        { label: 'Paste table (Excel, Planner, Smartsheet)…', action: () => openPasteImport(app) },
        { sep: true }
      );
    }
    items.push({ heading: 'Export' });
    if (!ro) items.push({ label: 'Save to file (.html)', hint: `${K}+S`, action: saveToFile });
    items.push(
      { label: 'Export JSON', action: exportJSON },
      { label: 'Export CSV', action: exportCSV },
      { label: 'Export standalone copy (.html)', hint: 'email it', action: exportStandalone },
      { label: 'Export Gantt as PNG', action: exportPNG },
      { label: 'Print…', hint: `${K}+P`, action: printPlan },
      { sep: true }
    );
    if (ro) items.push({ label: 'Unlock editing', action: unlock });
    else items.push({ label: 'Load sample plan', action: () => addPlan(samplePlan()) });
    items.push({ label: 'Keyboard shortcuts & help', hint: '?', action: showHelp });
    openMenu(anchor, items, { label: 'File' });
  }

  async function unlock() {
    let p = clonePlan(store.plan);
    const existing = storage.load(p.id);
    if (existing) {
      const newer = (Date.parse(existing.updatedAt) || 0) > (Date.parse(p.updatedAt) || 0);
      const saved = `“${esc(existing.name)}” (saved ${esc(fmtStamp(existing.updatedAt))})`;
      const r = await modal({
        title: 'Unlock editing',
        body: newer
          ? `<p>This browser has newer edits of ${saved} than this file.</p><p>Open your edits, keep both, or replace your edits with the file version? Replacing loses your edits.</p>`
          : `<p>This browser already has ${saved}.</p><p>Keep both, or replace the saved plan with this copy?</p>`,
        actions: newer
          ? [{ label: 'Cancel', value: 'cancel' }, { label: 'Replace my edits', value: 'replace', danger: true }, { label: 'Keep both', value: 'copy' }, { label: 'Open my edits', value: 'saved', primary: true }]
          : [{ label: 'Cancel', value: 'cancel' }, { label: 'Replace saved plan', value: 'replace' }, { label: 'Keep both', value: 'copy', primary: true }],
      });
      if (r.value === 'cancel') return;
      if (r.value === 'saved') p = existing;
      if (r.value === 'copy') {
        p.id = uid();
        p.name = `${p.name} (copy)`.slice(0, 200);
      }
    }
    store.readOnly = false;
    store.presenter = false;
    hideBanner();
    addPlan(p);
    toast(persistent ? 'Editing unlocked. Changes are saved in this browser.' : 'Editing unlocked, but browser storage is unavailable: use Export JSON to keep changes.', persistent ? 'info' : 'error', 6000);
  }

  // ---- toolbar menus --------------------------------------------------------
  function baselineMenu(anchor) {
    const p = store.plan;
    const has = !!p.baselineSavedAt;
    openMenu(anchor, [
      { label: has ? 'Save baseline again (replace)' : 'Save baseline', disabled: store.readOnly, action: async () => {
        if (has && !(await confirmBox(`Replace the baseline saved ${fmtStamp(p.baselineSavedAt)}?`, { ok: 'Replace' }))) return;
        store.commit('Save baseline', (pl) => {
          saveBaseline(pl);
          pl.settings.showBaseline = true;
        }, { touch: false, schedule: false });
        toast('Baseline saved. Ghost bars and the Variance column show slippage from here.');
      } },
      { label: 'Show baseline & variance', checked: !!p.settings.showBaseline, disabled: !has, action: () => store.commit('Show baseline', (pl) => {
        pl.settings.showBaseline = !pl.settings.showBaseline;
      }, UI) },
      { label: 'Clear baseline', danger: true, disabled: !has || store.readOnly, action: () => store.commit('Clear baseline', (pl) => {
        clearBaseline(pl);
        pl.settings.showBaseline = false;
      }, { touch: false, schedule: false }) },
      ...(has ? [{ sep: true }, { heading: `Saved ${fmtStamp(p.baselineSavedAt)}` }] : []),
    ], { label: 'Baseline' });
  }

  function columnsMenu(anchor) {
    const cols = columnState(store.plan).filter((c) => !c.fixed);
    openMenu(anchor, [
      { heading: 'Show columns' },
      ...cols.map((c) => ({
        label: c.key === 'progress' ? 'Progress %' : c.key === 'duration' ? 'Duration' : c.label,
        checked: c.visible,
        keepOpen: true,
        action: (on) => store.commit('Columns', (p) => {
          const cs = (p.settings.columns = p.settings.columns || {});
          cs[c.key] = { ...(cs[c.key] || {}), visible: on, explicit: true };
        }, UI),
      })),
      { sep: true },
      { label: 'Reset columns & widths', action: () => store.commit('Reset columns', (p) => {
        p.settings.columns = null;
      }, UI) },
    ], { label: 'Columns' });
  }

  function conflictsMenu(anchor) {
    const o = store.d.tree.outline;
    openMenu(anchor, [
      { heading: 'Violated dependencies' },
      ...store.d.conflicts.map((c) => ({
        label: `${o.get(c.predId)} → ${o.get(c.succId)} (${c.type}${formatLag(c.lag)}): ${c.days} day${c.days === 1 ? '' : 's'} early`,
        action: () => {
          if (store.view !== 'plan') setView('plan');
          reveal(c.succId);
          select(c.succId, { col: 'start' });
          app.grid.ensureVisible(c.succId);
          app.grid.focus();
        },
      })),
      { sep: true },
      { label: 'Turn on Auto-schedule to fix all', disabled: store.readOnly, action: toggleAuto },
    ], { label: 'Conflicts' });
  }

  function toggleAuto() {
    const on = !store.plan.settings.autoSchedule;
    store.commit(on ? 'Auto-schedule on' : 'Auto-schedule off', (p) => {
      p.settings.autoSchedule = on;
    }, { touch: true });
    toast(on ? 'Auto-schedule on: successors move to satisfy their links.' : 'Auto-schedule off: violated links are drawn in red and listed under Conflicts.');
  }

  // ---- filters, views, theme, presenter ------------------------------------
  const search = q('.search');
  let searchTimer = 0;
  search.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => setFilter('text', search.value), 120);
  });
  root.querySelectorAll('[data-filter]').forEach((sel) => sel.addEventListener('change', () => setFilter(sel.dataset.filter, sel.value)));
  function setFilter(k, v) {
    store.filter = { ...store.filter, [k]: v };
    store.ui(true);
  }
  function clearFilters() {
    store.filter = { text: '', owner: '', status: '', section: '', overdue: false };
    search.value = '';
    store.ui(true);
  }

  function setView(v) {
    store.view = v;
    store.ui();
    if (v === 'plan') app.grid.focus();
  }

  function togglePresenter() {
    store.presenter = !store.presenter;
    store.ui();
  }

  function cycleTheme() {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
    applyTheme(theme);
    storage.setPrefs({ theme });
    store.ui();
  }

  function showHelp() {
    const rows = [
      ['↑ ↓ ← →', 'Move between cells (Shift+↑/↓ extends the selection)'],
      ['Enter / F2', 'Edit the cell. Enter on the # column opens the task card'],
      ['Shift+Enter', 'Open the task card'],
      ['Type any key', 'Start editing the cell'],
      ['Esc', 'Cancel editing / close the card. Press again to let Tab leave the grid'],
      ['Tab / Shift+Tab', 'Indent / outdent the selected tasks'],
      [`Insert or ${K}+Enter`, 'New task below; Shift+Insert = new section'],
      ['Delete', 'Delete the selected rows (asks first)'],
      ['Alt+Shift+↑/↓', 'Move rows up / down'],
      ['Alt+← / Alt+→ or Space', 'Collapse / expand a summary task or section'],
      [`${K}+Z / Shift+${K}+Z`, 'Undo / redo (also Ctrl+Y)'],
      [`${K}+F`, 'Search'],
      [`${K}+S`, 'Save to file: download this HTML with the current plan embedded (opens editable)'],
      ['Gantt', 'Drag a bar to move it, drag its right edge to change the finish. Drag the small circle at a bar’s start or finish onto another bar to link them (drop on the left half → successor start, right half → successor finish). Click an arrow to edit or delete it; double-click a bar to open the card.'],
      ['Predecessors', 'Type outline numbers or #IDs with optional type and lag: 3, 1.2FS+2d, #7SS-1d, 4FF+1d, 5SF'],
      ['Board', 'Drag cards between columns; Shift+←/→ moves the focused card'],
      ['Grid rows', 'Drag the # cell to reorder; drop on the middle of a task to make it a subtask'],
    ];
    modal({
      title: 'Keyboard shortcuts & tips',
      wide: true,
      body: `<table class="kbd-table">${rows.map(([k, v]) => `<tr><td><kbd>${esc(k)}</kbd></td><td>${esc(v)}</td></tr>`).join('')}</table><p class="hint">Everything is stored in this browser (localStorage) per plan. Use File → Save to file to keep the plan inside an .html file, Export JSON for backups, or Export standalone copy to share a read-only version.</p>`,
      actions: [{ label: 'Close', value: 'cancel', primary: true }],
    });
  }

  // ---- header & toolbar wiring ---------------------------------------------
  const ACTS = {
    'use-file': useFileVersion,
    'banner-close': hideBanner,
    'add-task': addTask,
    'add-section': () => addSection(),
    indent: app.indent,
    outdent: app.outdent,
    delete: app.deleteSelection,
    undo: () => store.undo() || toast('Nothing to undo.'),
    redo: () => store.redo() || toast('Nothing to redo.'),
    'expand-all': () => setCollapsedAll(false),
    'collapse-all': () => setCollapsedAll(true),
    fit: () => store.commit('Zoom', (p) => {
      p.settings.zoom = 'fit';
    }, UI),
    today: () => app.gantt.scrollToDay(today()),
    auto: toggleAuto,
    critical: () => store.commit('Critical path', (p) => {
      p.settings.showCritical = !p.settings.showCritical;
    }, UI),
    baseline: baselineMenu,
    columns: columnsMenu,
    conflicts: conflictsMenu,
    'f-overdue': () => setFilter('overdue', !store.filter.overdue),
    'f-clear': clearFilters,
    file: fileMenu,
    plans: plansMenu,
    'view-plan': () => setView('plan'),
    'view-board': () => setView('board'),
    'view-logs': () => setView('logs'),
    present: togglePresenter,
    theme: cycleTheme,
    unlock,
    help: showHelp,
  };
  for (const scope of [q('.top'), q('.banner'), q('.toolbar')]) {
    scope.addEventListener('click', (e) => {
      const b = e.target.closest('[data-act]');
      if (b && scope.contains(b) && ACTS[b.dataset.act]) ACTS[b.dataset.act](b, e);
    });
  }
  q('.tabs').addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    const i = VIEWS.indexOf(store.view) + (e.key === 'ArrowRight' ? 1 : -1);
    const v = VIEWS[(i + VIEWS.length) % VIEWS.length];
    setView(v);
    q(`[data-act="view-${v}"]`).focus();
  });
  root.querySelectorAll('[data-set]').forEach((sel) =>
    sel.addEventListener('change', () => store.commit('Setting', (p) => {
      p.settings[sel.dataset.set] = sel.value;
    }, UI))
  );
  q('.plan-name').addEventListener('change', (e) => {
    const v = e.target.value.trim();
    if (!v) {
      e.target.value = store.plan.name;
      return;
    }
    store.commit('Rename plan', (p) => {
      p.name = v.slice(0, 200);
    }, { touch: false, schedule: false });
  });
  q('.plan-name').addEventListener('keydown', (e) => e.key === 'Enter' && e.target.blur());
  root.querySelectorAll('[data-p]').forEach((inp) =>
    inp.addEventListener('change', () => {
      const f = inp.dataset.p;
      const v = inp.value.trim();
      if (f === 'start' && !isISODate(v)) {
        toast('Enter a valid start date.', 'error');
        return render();
      }
      if (f === 'statusDate' && v && !isISODate(v)) return render();
      store.commit(`Edit plan ${f}`, (p) => {
        p[f] = v.slice(0, 200);
      }, { touch: false, schedule: false });
      return undefined;
    })
  );

  // splitter
  const sp = q('.splitter');
  const viewPlan = q('.view-plan');
  const clampW = (w) => Math.round(Math.max(220, Math.min(window.innerWidth - 220, w)));
  const gridWidth = () => clampW(store.plan.settings.gridWidth || Math.min(820, window.innerWidth * 0.5));
  const saveGridWidth = (w) => store.commit('Resize panes', (p) => {
    p.settings.gridWidth = w;
  }, UI);
  sp.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    sp.setPointerCapture(e.pointerId);
    const x0 = e.clientX;
    const w0 = q('.grid-pane').getBoundingClientRect().width;
    let w = w0;
    const mv = (ev) => {
      w = clampW(w0 + ev.clientX - x0);
      viewPlan.style.setProperty('--grid-w', `${w}px`);
    };
    const up = () => {
      sp.removeEventListener('pointermove', mv);
      sp.removeEventListener('pointerup', up);
      saveGridWidth(w);
    };
    sp.addEventListener('pointermove', mv);
    sp.addEventListener('pointerup', up);
  });
  sp.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    saveGridWidth(clampW(gridWidth() + (e.key === 'ArrowRight' ? 40 : -40)));
  });

  // ---- render -------------------------------------------------------------
  const setVal = (el, v) => {
    if (document.activeElement !== el && el.value !== v) el.value = v;
  };
  function fillSelect(sel, opts, all) {
    const sig = JSON.stringify(opts);
    if (sel.dataset.sig !== sig) {
      sel.innerHTML = `<option value="">${esc(all)}</option>${opts.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('')}`;
      sel.dataset.sig = sig;
    }
    sel.value = store.filter[sel.dataset.filter] || '';
    sel.classList.toggle('on', !!sel.value);
  }

  function updateSaveState() {
    const el = q('.save-state');
    let text = 'Saved in this browser';
    let err = false;
    if (store.readOnly) text = store.embedded ? 'Shared copy' : '';
    else if (!persistent) {
      text = 'Not saved: browser storage unavailable';
      err = true;
    } else if (store.saveState === 'error') {
      text = 'Not saved: browser storage full';
      err = true;
    } else if (store.saveState === 'saving') text = 'Saving…';
    el.textContent = text;
    el.classList.toggle('err', err);
  }

  function renderHeader() {
    const p = store.plan;
    setVal(q('.plan-name'), p.name);
    root.querySelectorAll('[data-p]').forEach((inp) => setVal(inp, p[inp.dataset.p] || ''));
    const st = planStats(p, store.d.tree);
    const n = store.d.conflicts.length;
    q('.stats').innerHTML = `<span class="chip" title="Tasks excluding summaries">${st.tasks} tasks</span>
<span class="chip" title="Duration-weighted progress"><span class="bar-mini" aria-hidden="true"><span style="width:${st.percent}%"></span></span><b>${st.percent}%</b>&nbsp;done</span>
<span class="chip">Finish&nbsp;<b>${esc(fmtDateLong(st.finish))}</b></span>
<button type="button" class="chip${st.overdue ? ' bad' : ''}" data-act="f-overdue" aria-pressed="${!!store.filter.overdue}" title="Filter overdue tasks"><b>${st.overdue}</b>&nbsp;overdue</button>
${n ? `<button type="button" class="chip conf" data-act="conflicts" aria-haspopup="menu" title="Dependencies that are not satisfied">⚠ <b>${n}</b>&nbsp;conflict${n === 1 ? '' : 's'}</button>` : ''}`;
  }

  function renderToolbar() {
    const s = store.plan.settings;
    const pressed = (act, v) => root.querySelectorAll(`[data-act="${act}"]`).forEach((b) => b.setAttribute('aria-pressed', String(!!v)));
    pressed('auto', s.autoSchedule);
    pressed('critical', s.showCritical);
    pressed('f-overdue', store.filter.overdue);
    pressed('present', store.presenter);
    q('[data-act="undo"]').disabled = !store.undoStack.length;
    q('[data-act="redo"]').disabled = !store.redoStack.length;
    q('[data-act="theme"]').textContent = `Theme: ${theme[0].toUpperCase()}${theme.slice(1)}`;
    q('[data-act="present"]').textContent = store.presenter ? 'Exit presenter' : 'Present';
    root.querySelectorAll('[data-set]').forEach((sel) => setVal(sel, s[sel.dataset.set]));
    const tasks = store.d.tree.tasks;
    fillSelect(q('[data-filter="owner"]'), [...new Set(tasks.map((t) => t.owner).filter(Boolean))].sort().map((o) => [o, o]), 'All owners');
    fillSelect(q('[data-filter="status"]'), STATUSES.map((x) => [x, x]), 'All statuses');
    fillSelect(q('[data-filter="section"]'), store.plan.rows.filter((r) => !isTask(r)).map((r) => [String(r.id), r.name]), 'All sections');
    if (document.activeElement !== search) search.value = store.filter.text;
    q('.filters').classList.toggle('active', !!store.d.matches);
    for (const v of VIEWS) q(`[data-act="view-${v}"]`).setAttribute('aria-selected', String(store.view === v));
  }

  function render() {
    const b = document.body.classList;
    b.toggle('presenter', store.presenter);
    b.toggle('readonly', store.readOnly);
    for (const v of VIEWS) {
      b.toggle(`view-${v}-on`, store.view === v);
      q(`.view-${v}`).hidden = store.view !== v;
    }
    viewPlan.style.setProperty('--grid-w', `${gridWidth()}px`);
    renderHeader();
    renderToolbar();
    updateSaveState();
    if (store.view === 'plan') {
      app.grid.render();
      app.gantt.render();
    } else if (store.view === 'board') app.board.render();
    else app.logs.render();
    card.render();
    document.title = `${store.plan.name} · Planboard`;
  }

  app.grid = createGrid(app, q('.grid-pane'));
  app.gantt = createGantt(app, q('.gantt-pane'));
  app.board = createBoard(app, q('.view-board'));
  app.logs = createLogs(app, q('.view-logs'));
  const card = createCard(app, q('.card'));

  store.on((kind, data) => {
    if (kind === 'change') {
      render();
      if (data && data.moved && data.moved.size) toast(`Auto-schedule moved ${data.moved.size} task${data.moved.size === 1 ? '' : 's'}.`, 'info', 2500);
    } else if (kind === 'error') toast(data, 'error', 6000);
    else if (kind === 'warn') toast(data, 'warn', 6000);
    else if (kind === 'readonly') toast('This is a read-only copy. Click “Unlock editing” to make changes.');
    else if (kind === 'saved') updateSaveState();
  });

  // ---- global keys, drag & drop files, lifecycle ---------------------------
  document.addEventListener('keydown', (e) => {
    if (document.querySelector('dialog[open]')) return;
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (mod(e) && !e.altKey && k === 'z') {
      if (isTyping(e)) return;
      e.preventDefault();
      if (e.shiftKey) store.redo();
      else store.undo();
    } else if (mod(e) && !e.altKey && k === 'y' && !isTyping(e)) {
      e.preventDefault();
      store.redo();
    } else if (mod(e) && !e.altKey && k === 's') {
      e.preventDefault();
      if (isTyping(e)) e.target.blur();
      setTimeout(saveToFile);
    } else if (mod(e) && !e.altKey && k === 'f') {
      e.preventDefault();
      search.focus();
      search.select();
